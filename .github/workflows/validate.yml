name: Validate Cloudflare Tunnel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: sh -n cloudflared/rootfs/usr/local/bin/run-cloudflared
      - run: shellcheck cloudflared/rootfs/usr/local/bin/run-cloudflared
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44 renovate-config-validator --strict renovate.json
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: cloudflared
          platforms: ${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          load: true
          tags: ha-cloudflared:test
      - run: docker run --rm --platform ${{ matrix.platform }} --entrypoint cloudflared ha-cloudflared:test --version
