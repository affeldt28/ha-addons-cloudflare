name: ✅ Validate Cloudflare Tunnel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: sh -n cloudflared/rootfs/usr/local/bin/run-cloudflared
      - run: shellcheck cloudflared/rootfs/usr/local/bin/run-cloudflared
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44 renovate-config-validator --strict renovate.json
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cloudflared
          platforms: ${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          load: true
          tags: ha-cloudflared:test
      - run: docker run --rm --platform ${{ matrix.platform }} --entrypoint cloudflared ha-cloudflared:test --version
