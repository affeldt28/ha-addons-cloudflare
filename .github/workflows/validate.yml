name: ✅ Validate Cloudflare Tunnel
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: 📦 Install validation tools
        run: |
          pip install -r tests/requirements.txt
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: 🔎 Check startup script syntax
        run: sh -n cloudflared/rootfs/usr/local/bin/run-cloudflared

      - name: 🧹 Lint startup script
        run: shellcheck cloudflared/rootfs/usr/local/bin/run-cloudflared

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: ✅ Validate Renovate configuration
        run: npx --yes --package renovate@44 renovate-config-validator --strict .github/renovate.json

      - name: 🧪 Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗️ Build add-on image
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t ha-cloudflared:test cloudflared

      - name: 🧪 Verify cloudflared binary
        run: docker run --rm --entrypoint cloudflared ha-cloudflared:test --version
